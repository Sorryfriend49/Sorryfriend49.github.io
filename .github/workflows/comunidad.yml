# De lunes a viernes: arma obras.json desde catalogo.json (scripts/catalogo.mjs) con los datos de
# AniList, y después la opinión de la comunidad: junta puntajes, votos y reseñas de AniList,
# MyAnimeList, Kitsu y MangaUpdates, además de las etiquetas, las
# recomendaciones y la actividad de AniList; calcula los resultados con
# scripts/comunidad.mjs (y el modelo de sentimiento de scripts/tono.mjs), escribe
# resúmenes con Gemma 4 (scripts/resumenes.mjs) y publica datos/comunidad.json en la
# página. Es gratis: GitHub no cobra las tareas automáticas de los repositorios públicos.
#
# Los resúmenes van aparte: si hay muchos por escribir, se reparten entre varias máquinas
# que trabajan a la vez (una cada 15, hasta 8), y al final otra los guarda todos juntos.
#
# Va por niveles (scripts/niveles.mjs): cada día renueva por completo solo las obras que les
# toca (las que siguen saliendo, una vez por semana; las terminadas, una vez cada 4 semanas;
# las nuevas, apenas llegan) y, para todas, el puntaje, los votos y la popularidad de AniList.
# Para renovarlas todas de una vez (por ejemplo, si cambia la forma de calcular): Run workflow
# con "Renovar todas las obras" marcado.
#
# Obras nuevas: de lunes a viernes entran solas hasta 20 (scripts/nuevas.mjs). Para agregar una
# a mano, suma su número de AniList a catalogo.json (la tarea corre sola al guardarlo).
# Para correrla a mano: pestaña Actions > "Opinión de la comunidad" > Run workflow.
# MyAnimeList usa una clave gratis (app "Frozen Project", uso no comercial) guardada en
# Settings > Secrets and variables > Actions como MAL_CLIENT_ID. Si algún día deja de
# funcionar, crea otra en https://myanimelist.net/apiconfig y reemplaza el secreto; sin
# clave, la tarea sigue con las otras tres comunidades.
name: Opinión de la comunidad

# A la hora exacta la lanza cron-job.org con la API de GitHub (POST a
# /repos/Sorryfriend49/Sorryfriend49.github.io/actions/workflows/comunidad.yml/dispatches, con un
# token que solo tiene permiso de lanzar tareas). GitHub atrasa horas, y a veces pierde, sus
# tareas programadas: el horario de abajo queda de respaldo.
# cron-job.org manda {"ref":"main","inputs":{"obras_nuevas":"agregar"}} para que también entren las obras nuevas.
on:
  schedule:
    - cron: '17 9 * * 1-5'      # de lunes a viernes, 9:17 UTC (4:17 a. m. en Colombia)
  workflow_dispatch:
    inputs:
      todas:
        description: 'Renovar todas las obras (no solo las del día)'
        type: boolean
        default: false
      resumir:
        description: 'Rehacer el resumen de estas obras (sus números de AniList, separados por comas)'
        type: string
        default: ''
      obras_nuevas:
        description: 'Obras nuevas: simular (solo muestra cuáles entrarían) o agregarlas ahora'
        type: choice
        options: ['no', 'simular', 'agregar']
        default: 'no'
  push:
    branches: [main]
    paths:                      # también corre cuando cambia el catálogo o el algoritmo
      - 'catalogo.json'
      - 'obras.json'
      - 'scripts/**'
      - '!scripts/populares.mjs'  # lo más popular tiene su propia tarea diaria (populares.yml)
      - '.github/workflows/comunidad.yml'

permissions:
  contents: write               # para guardar datos/ en el repositorio
  pages: write                  # para pedir que se vuelva a publicar la página

concurrency:
  group: opinion-comunidad
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # Por niveles, un día normal con unas 200 obras tarda pocos minutos; renovarlas todas,
    # unos 25. Las tareas de los repositorios públicos son gratis: se deja margen.
    timeout-minutes: 90
    outputs:
      hay: ${{ steps.repartir.outputs.hay }}
      maquinas: ${{ steps.repartir.outputs.maquinas }}
      ids: ${{ steps.repartir.outputs.ids }}
    steps:
      # Siempre la última versión de main: si esta ejecución esperó a que terminara otra,
      # así parte de los datos que la otra acaba de guardar (y no de una copia vieja).
      - name: Descargar el repositorio
        uses: actions/checkout@v5
        with:
          ref: main

      # Modelo de sentimiento (gratis, licencia MIT). --ignore-scripts evita bajar
      # extras para tarjetas gráficas que aquí no se usan.
      - name: Instalar el modelo de sentimiento
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Recordar el modelo entre ejecuciones
        uses: actions/cache@v5
        with:
          path: .modelos
          key: modelo-sentimiento-${{ hashFiles('scripts/package-lock.json') }}

      # De lunes a viernes entran solas hasta 20 obras nuevas (scripts/nuevas.mjs: 10 en tendencia
      # o estrenos y 10 populares que faltan). Si AniList falla, el resto de la tarea sigue igual.
      - name: Buscar obras nuevas
        if: github.event_name == 'schedule' || inputs.obras_nuevas == 'simular' || inputs.obras_nuevas == 'agregar'
        continue-on-error: true
        run: node scripts/nuevas.mjs ${{ inputs.obras_nuevas == 'simular' && '--simular' || '' }} ${{ inputs.obras_nuevas == 'agregar' && '--forzar' || '' }}

      - name: Actualizar el catálogo desde AniList
        run: node scripts/catalogo.mjs

      - name: Calcular la opinión de la comunidad
        run: |
          node --version
          node scripts/comunidad.mjs
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          TODAS: ${{ inputs.todas && 'si' || '' }}

      # Lo que baja la página: la lista liviana y una ficha por obra (scripts/lista.mjs). Después,
      # la página propia de cada obra (obra/<id>/, para compartirla y para Google) y el mapa del
      # sitio (scripts/paginas.mjs, lo corre lista.mjs)
      - name: Armar la lista liviana, las fichas y la página de cada obra
        run: node scripts/lista.mjs

      # Cuántas máquinas usar para los resúmenes (solo se pasa la lista de obras, no sus reseñas)
      - name: Repartir los resúmenes
        id: repartir
        run: node scripts/resumenes.mjs --repartir
        env:
          RESUMIR: ${{ inputs.resumir }}

      - name: Guardar los resultados
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ obras.json catalogo.json obra/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Actualiza el catálogo y la opinión de la comunidad"
          for intento in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "cambios=si" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((intento * 10))
          done
          exit 1

      - name: Publicar la página con los datos nuevos
        if: steps.guardar.outputs.cambios == 'si'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la publicación; saldrá con el próximo cambio."
        env:
          GH_TOKEN: ${{ github.token }}

  # Resúmenes con Gemma 4 (modelo abierto de Google, licencia Apache 2.0) con Ollama, en una
  # o varias máquinas a la vez. Cada una baja de AniList las reseñas de sus obras (no se
  # guardan en ningún lado), le pasa a Gemma sus frases clave y entrega solo los resúmenes.
  # Si una falla, las demás siguen y esas obras se intentan otro día.
  resumenes:
    needs: actualizar
    if: needs.actualizar.outputs.hay == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJSON(needs.actualizar.outputs.maquinas) }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5
        with:
          ref: main

      # El modelo de sentimiento elige las frases clave de cada reseña (las que opinan de un tema)
      - name: Instalar el modelo de sentimiento
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Usar el modelo guardado
        uses: actions/cache/restore@v5
        with:
          path: .modelos
          key: modelo-sentimiento-${{ hashFiles('scripts/package-lock.json') }}

      - name: Instalar Gemma 4
        timeout-minutes: 15
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://127.0.0.1:11434/api/version > /dev/null; then
            (ollama serve > /tmp/ollama.log 2>&1 &)
          fi
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama pull gemma4:e4b

      - name: Escribir los resúmenes
        timeout-minutes: 45
        run: node scripts/resumenes.mjs --parte ${{ matrix.parte }} --de ${{ strategy.job-total }}
        env:
          PENDIENTES: ${{ needs.actualizar.outputs.ids }}

      - name: Entregar los resúmenes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resumenes-${{ matrix.parte }}
          path: .tmp/resumenes/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  guardar-resumenes:
    needs: [actualizar, resumenes]
    if: always() && needs.actualizar.outputs.hay == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Recibir los resúmenes de cada máquina
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: resumenes-*
          path: .tmp/resumenes
          merge-multiple: true

      - name: Juntarlos en la opinión de la comunidad
        run: |
          node scripts/resumenes.mjs --juntar
          node scripts/lista.mjs

      - name: Guardar los resúmenes
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/comunidad.json datos/lista.json datos/fichas/ obra/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No hay resúmenes nuevos."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Agrega los resúmenes de Gemma"
          for intento in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "cambios=si" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((intento * 10))
          done
          exit 1

      - name: Publicar la página con los resúmenes
        if: steps.guardar.outputs.cambios == 'si'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la publicación; saldrá con el próximo cambio."
        env:
          GH_TOKEN: ${{ github.token }}
