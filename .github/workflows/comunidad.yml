# Cada lunes: arma obras.json desde catalogo.json (scripts/catalogo.mjs) con los datos de
# AniList, y después la opinión de la comunidad: junta puntajes, votos y reseñas de AniList,
# Kitsu y MangaUpdates (y MyAnimeList si hay clave), además de las etiquetas, las
# recomendaciones y la actividad de AniList; calcula los resultados con
# scripts/comunidad.mjs (y el modelo de sentimiento de scripts/tono.mjs), escribe
# resúmenes con Gemma 4 (scripts/resumenes.mjs) y publica datos/comunidad.json en la
# página. Es gratis: GitHub no cobra las tareas automáticas de los repositorios públicos.
#
# Para agregar obras: suma su número de AniList a catalogo.json (la tarea corre sola al guardarlo).
# Para correrla a mano: pestaña Actions > "Opinión de la comunidad" > Run workflow.
# Para sumar MyAnimeList (opcional y gratis): crea una clave en
# https://myanimelist.net/apiconfig y guárdala en Settings > Secrets and variables >
# Actions como MAL_CLIENT_ID.
name: Opinión de la comunidad

on:
  schedule:
    - cron: '17 9 * * 1'        # lunes 9:17 UTC (4:17 a. m. en Colombia)
  workflow_dispatch:
  push:
    branches: [main]
    paths:                      # también corre cuando cambia el catálogo o el algoritmo
      - 'catalogo.json'
      - 'obras.json'
      - 'scripts/**'
      - '.github/workflows/comunidad.yml'

permissions:
  contents: write               # para guardar datos/ en el repositorio
  pages: write                  # para pedir que se vuelva a publicar la página

concurrency:
  group: opinion-comunidad
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      # Modelo de sentimiento (gratis, licencia MIT). --ignore-scripts evita bajar
      # extras para tarjetas gráficas que aquí no se usan.
      - name: Instalar el modelo de sentimiento
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Recordar el modelo entre ejecuciones
        uses: actions/cache@v5
        with:
          path: .modelos
          key: modelo-sentimiento-${{ hashFiles('scripts/package-lock.json') }}

      - name: Actualizar el catálogo desde AniList
        run: node scripts/catalogo.mjs

      - name: Calcular la opinión de la comunidad
        run: |
          node --version
          node scripts/comunidad.mjs
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}

      # Resúmenes con Gemma 4 (modelo abierto de Google, licencia Apache 2.0) en esta misma
      # máquina, con Ollama. Solo se instala si hay obras con reseñas nuevas; si algo falla,
      # la tarea sigue y la página conserva los resúmenes anteriores.
      - name: ¿Hay resúmenes por escribir?
        id: pendientes
        run: |
          if [ -s .tmp/pendientes.json ]; then echo "hay=si" >> "$GITHUB_OUTPUT"; else echo "hay=no" >> "$GITHUB_OUTPUT"; fi

      - name: Instalar Gemma 4
        if: steps.pendientes.outputs.hay == 'si'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://127.0.0.1:11434/api/version > /dev/null; then
            (ollama serve > /tmp/ollama.log 2>&1 &)
          fi
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama pull gemma4:e4b

      - name: Escribir los resúmenes
        if: steps.pendientes.outputs.hay == 'si'
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/resumenes.mjs

      - name: Guardar los resultados
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ obras.json catalogo.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Actualiza el catálogo y la opinión de la comunidad"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "cambios=si" >> "$GITHUB_OUTPUT"

      - name: Publicar la página con los datos nuevos
        if: steps.guardar.outputs.cambios == 'si'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la publicación; saldrá con el próximo cambio."
        env:
          GH_TOKEN: ${{ github.token }}
